version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Robolectric names its own build of the Android framework jar for each SDK it runs (`@Config(sdk = [35])`);
      # it moves with Robolectric by hand, from Robolectric's `AndroidSdk` list (libs.versions.toml). Dependabot
      # would bump it to a newer Android's jar, which this Robolectric can't use.
      - dependency-name: "org.robolectric:android-all-instrumented"
    cooldown:
      # Wait until a version has been out for 5 days; a bad release is usually caught and pulled by then.
      # Security updates ignore this.
      default-days: 5
    groups:
      # Kotlin, its compiler plugins and KSP must move together. Hilt/Dagger reads Kotlin metadata,
      # so a Kotlin bump usually needs a Hilt bump in the same change.
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
          - "com.google.dagger*"
      androidx:
        patterns:
          - "androidx.*"
      everything-else:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
