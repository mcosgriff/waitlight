<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wait times with bottom navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; font-family: 'Roboto Flex', system-ui, sans-serif; background: #F6F7F4; color: #17201B">

<header style="display: flex; flex-direction: column; gap: 6px; padding: 20px 16px 12px 20px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.3px">Wait times</h1>
<button disabled="" aria-label="Refresh unavailable, data is current" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent; display: flex; align-items: center; justify-content: center; color: #A3ABA7">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"></path><path d="M21 3v6h-6"></path></svg>
</button>
</div>
<div style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #4A554F">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
<span>Arvada, CO 80003</span><span aria-hidden="true">·</span><span>Updated 4 min ago</span>
</div>
<span style="font-size: 13px; font-weight: 500; padding-left: 22px; color: #56615B">Next update in ~11 min</span>
</header>

<section style="margin: 0 16px; padding: 16px; border-radius: 20px; color: #FFFFFF; display: flex; align-items: center; gap: 14px; background: #1F4E5F">
<div style="width: 56px; height: 56px; border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; background: #1B7F3B">
<span style="font-size: 20px; font-weight: 700; line-height: 1">22</span>
<span style="font-size: 11px; font-weight: 600; line-height: 1.2">min</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: #CFE3EA">Fastest overall right now</span>
<span style="font-size: 19px; font-weight: 600">Arvada</span>
<span style="font-size: 14px; color: #E3EEF1">9 min drive + 13 min wait</span>
</div>
</section>

<div style="display: flex; gap: 8px; padding: 14px 16px 10px 16px; flex-wrap: wrap">
<span style="height: 36px; padding: 0 14px; border-radius: 18px; font-size: 14px; font-weight: 500; display: flex; align-items: center; background: #1F4E5F; color: #FFFFFF">Nearest</span>
<span style="height: 36px; padding: 0 14px; border-radius: 18px; font-size: 14px; font-weight: 500; display: flex; align-items: center; border: 1px solid #C9CFCB; background: #FFFFFF">Fastest overall</span>
<span style="height: 36px; padding: 0 14px; border-radius: 18px; font-size: 14px; font-weight: 500; display: flex; align-items: center; border: 1px solid #C9CFCB; background: #FFFFFF">Low-profile rims</span>
</div>

<ul style="list-style: none; margin: 0; padding: 0 12px 12px 12px; display: flex; flex-direction: column; gap: 8px; flex-grow: 1; overflow: hidden">
<sc-for list="{{rows}}" as="s" hint-placeholder-count="4">
<li style="display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 16px; min-height: 72px; box-sizing: border-box; background: #FFFFFF">
<div role="img" aria-label="Short wait, {{s.wait}} minutes" style="width: 52px; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; background: #1B7F3B; color: #FFFFFF">
<span style="font-weight: 700; line-height: 1; font-size: 18px">{{s.wait}}</span>
<span style="font-size: 10px; font-weight: 600; line-height: 1.3">min</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
<span style="font-size: 16px; font-weight: 600">{{s.name}}</span>
<span style="font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #56615B">{{s.addr}}</span>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0">
<span style="font-size: 15px; font-weight: 600">{{s.mi}} mi</span>
<span style="font-size: 12px; color: #56615B">{{s.drive}} min drive</span>
</div>
</li>
</sc-for>
</ul>

<nav aria-label="Main" style="display: flex; height: 72px; flex-shrink: 0; border-top: 1px solid #E3E6E1; background: #FFFFFF">
<a href="EntryTabs.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 12px; font-weight: 700; color: #17201B">
<span style="width: 56px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; background: #E2EDF0; color: #1F4E5F">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 1.5"></path><path d="M9.5 2.5h5"></path></svg>
</span>
Wait times
</a>
<a href="Main.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 12px; font-weight: 500; color: #4A554F">
<span style="position: relative; width: 56px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.5h11v10h-11z"></path><path d="M13.5 9.5h4l3.5 3.5v3.5h-7.5"></path><circle cx="6.5" cy="17.5" r="1.8"></circle><circle cx="17" cy="17.5" r="1.8"></circle></svg>
<span style="position: absolute; top: 0; right: 8px; min-width: 16px; height: 16px; border-radius: 8px; padding: 0 4px; box-sizing: border-box; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; background: #1B7F3B; color: #FFFFFF">6</span>
</span>
Roadside vans
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [
        { name: 'Arvada', addr: '5185 Marshall St., Arvada', mi: '3.1', drive: 9, wait: 13 },
        { name: 'Broomfield', addr: '11609 Teller St., Broomfield', mi: '6.4', drive: 13, wait: 19 },
        { name: 'Golden', addr: '15335 W. 44th Ave., Golden', mi: '8.2', drive: 15, wait: 8 },
        { name: 'Northglenn', addr: '1950 E. 112th Ave., Northglenn', mi: '9.0', drive: 16, wait: 23 },
        { name: 'Denver (Lipan)', addr: '2300 S. Lipan St., Denver', mi: '12.6', drive: 22, wait: 9 }
      ]
    };
  }
}
</script>
</body>
</html>
