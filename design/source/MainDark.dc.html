<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nearby emissions stations — dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px">
<dc-import name="Main" dark="{{true}}" scenario="{{scenario}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"scenario":{"editor":"enum","options":["live","due","closed","stale","offline","broken"],"default":"live","section":"State"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { scenario: this.props.scenario ?? 'live' };
  }
}
</script>
</body>
</html>
