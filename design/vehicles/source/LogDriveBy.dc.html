<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log a drive-by</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&amp;display=swap">
<style>
body{margin:0}
a{color:#1F4E5F}a:hover{color:#163A47}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; font-family: 'Roboto Flex', system-ui, sans-serif; background: #59625E; color: #17201B">

<section role="dialog" aria-label="Log a drive-by" style="background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 10px 22px 22px 22px; display: flex; flex-direction: column; gap: 16px">
<span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #C9CFCB"></span>
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 4px 0 0 0; font-size: 22px; font-weight: 700">Log a drive-by</h2>
<span style="font-size: 14px; color: #4A554F">Harlan St → EB I-70</span>
</div>

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="font-size: 14px; font-weight: 600; margin-bottom: 8px">Which vehicle drove past?</legend>
<label style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px; border-radius: 14px; border: 2px solid #1F4E5F; background: #E2EDF0">
<input type="radio" name="vehicle" checked="" style="width: 20px; height: 20px; accent-color: #1F4E5F">
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
<span style="font-size: 15px; font-weight: 600">2011 Volkswagen GTI</span>
<span style="font-size: 12px; color: #1B7F3B; font-weight: 600">In its window · would be 2 of 2</span>
</span>
</label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px; border-radius: 14px; border: 1px solid #C9CFCB">
<input type="radio" name="vehicle" style="width: 20px; height: 20px; accent-color: #1F4E5F">
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
<span style="font-size: 15px; font-weight: 600">2016 Honda Fit</span>
<span style="font-size: 12px; color: #8A5F00; font-weight: 600">In its window · closes Dec 1 · would be 1 of 2</span>
</span>
</label>
</fieldset>

<div style="display: flex; gap: 10px">
<label style="flex: 3; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #56615B">Date
<input type="text" value="Fri, Nov 20" style="height: 48px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid #8C9792; font: inherit; font-size: 15px; color: #17201B">
</label>
<label style="flex: 2; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #56615B">Time
<input type="text" value="4:52 PM" style="height: 48px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid #8C9792; font: inherit; font-size: 15px; color: #17201B">
</label>
</div>
<span style="font-size: 12px; line-height: 1.45; color: #56615B">Starts at now; no time in the future. With one vehicle, this question isn't asked.</span>

<div style="display: flex; gap: 10px">
<a href="VehicleDetail.dc.html" style="flex: 1; height: 48px; border-radius: 24px; border: 1px solid #C9CFCB; color: #17201B; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 15px; font-weight: 600">Cancel</a>
<a href="VehicleDetail.dc.html" style="flex: 1; height: 48px; border-radius: 24px; background: #1F4E5F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 15px; font-weight: 600">Save</a>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
