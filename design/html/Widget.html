<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home-screen widget</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&amp;display=swap">
<style>
body{margin:0}
a{color:#1F4E5F}a:hover{color:#163A47}
</style>
</head>
<body>


<div style="width: 390px; height: 420px; box-sizing: border-box; padding: 40px 16px; display: flex; flex-direction: column; justify-content: center; background: #2C3A36; font-family: 'Roboto Flex', system-ui, sans-serif">
<div style="background: #F6F7F4; color: #17201B; border-radius: 28px; padding: 18px 18px 14px 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 16px; font-weight: 700">Emissions waits</span>
<span style="font-size: 12px; color: #56615B">4 min ago</span>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">

<div style="display: flex; align-items: center; gap: 12px">
<div role="img" aria-label="Short wait, 13 minutes" style="position: relative; width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 16px; font-weight: 700; background: #1B7F3B; color: #FFFFFF">13
<span aria-hidden="true" style="position: absolute; right: -4px; bottom: -4px; width: 20px; height: 20px; border-radius: 10px; background: #F6F7F4; color: #1B7F3B; display: flex; align-items: center; justify-content: center">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.3l2.8 2.8L16.2 9.6"></path></svg>


</span>
</div>
<div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
<span style="font-size: 15px; font-weight: 600">Arvada</span>
<span style="font-size: 12px; color: #56615B">3.1 mi</span>
</div>
<span style="font-size: 13px; font-weight: 500; color: #4A554F">Short</span>
</div>

<div style="display: flex; align-items: center; gap: 12px">
<div role="img" aria-label="Short wait, 19 minutes" style="position: relative; width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 16px; font-weight: 700; background: #1B7F3B; color: #FFFFFF">19
<span aria-hidden="true" style="position: absolute; right: -4px; bottom: -4px; width: 20px; height: 20px; border-radius: 10px; background: #F6F7F4; color: #1B7F3B; display: flex; align-items: center; justify-content: center">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.3l2.8 2.8L16.2 9.6"></path></svg>


</span>
</div>
<div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
<span style="font-size: 15px; font-weight: 600">Broomfield</span>
<span style="font-size: 12px; color: #56615B">6.4 mi</span>
</div>
<span style="font-size: 13px; font-weight: 500; color: #4A554F">Short</span>
</div>

<div style="display: flex; align-items: center; gap: 12px">
<div role="img" aria-label="Short wait, 8 minutes" style="position: relative; width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 16px; font-weight: 700; background: #1B7F3B; color: #FFFFFF">8
<span aria-hidden="true" style="position: absolute; right: -4px; bottom: -4px; width: 20px; height: 20px; border-radius: 10px; background: #F6F7F4; color: #1B7F3B; display: flex; align-items: center; justify-content: center">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.3l2.8 2.8L16.2 9.6"></path></svg>


</span>
</div>
<div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
<span style="font-size: 15px; font-weight: 600">Golden</span>
<span style="font-size: 12px; color: #56615B">8.2 mi</span>
</div>
<span style="font-size: 13px; font-weight: 500; color: #4A554F">Short</span>
</div>

</div>
</div>
</div>

</body>
</html>
